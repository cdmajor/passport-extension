<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Passport — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f0f13; color: #f0f0f0; padding: 32px; max-width: 480px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 28px; }
    h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #666; margin-bottom: 14px; }
    .section { margin-bottom: 32px; }
    .card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 12px; padding: 18px; margin-bottom: 10px; }
    .plan-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .plan-title { font-size: 17px; font-weight: 700; }
    .badge-active   { font-size: 11px; font-weight: 700; background: #6366f1; color: #fff; padding: 3px 10px; border-radius: 999px; }
    .badge-inactive { font-size: 11px; font-weight: 600; background: #2a2a3e; color: #888; padding: 3px 10px; border-radius: 999px; }
    .plan-hint { font-size: 12px; color: #555; margin-top: 4px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; margin-top: 12px; }
    select { width: 100%; background: #12121f; border: 1px solid #2a2a3e; border-radius: 8px; padding: 9px 12px; color: #f0f0f0; font-size: 14px; outline: none; }
    select:focus { border-color: #6366f1; }
    button { border: none; border-radius: 9px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 13px; width: 100%; margin-top: 8px; }
    .primary   { background: #6366f1; color: #fff; }
    .primary:hover { background: #4f51c9; }
    .secondary { background: #1e1e30; color: #ccc; border: 1px solid #333; }
    .status { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .ok   { color: #4ade80; }
    .err  { color: #ef4444; }
    .info { color: #818cf8; }
    hr { border: none; border-top: 1px solid #1e1e2e; margin: 28px 0; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e1e2e; }
    .toggle-row span { font-size: 14px; }
    .save-btn { background: #6366f1; color: #fff; margin-top: 16px; }
    .saved-msg { color: #4ade80; font-size: 12px; margin-left: 12px; opacity: 0; transition: opacity 0.3s; display: inline; }
    .saved-msg.visible { opacity: 1; }
  </style>
</head>
<body>
  <h1>🛂 Passport Settings</h1>

  <!-- Subscription -->
  <div class="section">
    <h2>Subscription</h2>
    <div class="card">
      <div class="plan-row">
        <div class="plan-title" id="planTitle">Checking…</div>
        <div id="planBadge"></div>
      </div>
      <div class="plan-hint" id="planHint"></div>
    </div>
    <div id="subStatus" class="status"></div>
    <div id="buyPanel" style="display:none">
      <button class="primary"   id="buyLiteBtn">Get Lite — $4.99 / mo</button>
      <button class="secondary" id="buyExplorerBtn">Get Explorer — $12.99 / mo</button>
      <button class="secondary" id="buyProBtn">Get Pro — $34.99 / mo</button>
    </div>
  </div>

  <hr />

  <!-- Translation -->
  <div class="section">
    <h2>Translation</h2>
    <label for="native-lang">Your native language (for auto-translation)</label>
    <select id="native-lang">
      <option value="">— Select language —</option>
      <option value="English">English</option>
      <option value="Spanish">Spanish</option>
      <option value="French">French</option>
      <option value="German">German</option>
      <option value="Japanese">Japanese</option>
      <option value="Korean">Korean</option>
      <option value="Portuguese">Portuguese</option>
      <option value="Italian">Italian</option>
      <option value="Chinese (Simplified)">Chinese (Simplified)</option>
      <option value="Chinese (Traditional)">Chinese (Traditional)</option>
      <option value="Arabic">Arabic</option>
      <option value="Hindi">Hindi</option>
      <option value="Russian">Russian</option>
      <option value="Turkish">Turkish</option>
      <option value="Dutch">Dutch</option>
      <option value="Polish">Polish</option>
      <option value="Swedish">Swedish</option>
      <option value="Vietnamese">Vietnamese</option>
      <option value="Thai">Thai</option>
      <option value="Indonesian">Indonesian</option>
    </select>
    <div class="toggle-row" style="margin-top:14px">
      <span>Auto-translate pages when a country is active</span>
      <input type="checkbox" id="auto-translate" />
    </div>
    <button class="save-btn" id="save">Save Settings</button>
    <span class="saved-msg" id="saved-msg">Saved!</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
