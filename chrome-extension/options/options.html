<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Passport — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f0f13; color: #f0f0f0; padding: 40px; max-width: 520px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 32px; }
    .section { margin-bottom: 32px; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #555; margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; }
    select, input[type="text"] { width: 100%; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; padding: 9px 12px; color: #f0f0f0; font-size: 14px; outline: none; }
    select:focus, input:focus { border-color: #6366f1; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1e1e2e; }
    .toggle-row span { font-size: 14px; }
    .btn { border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f51c9; }
    .btn-danger { background: #3a1a1a; color: #ef4444; border: 1px solid #ef444433; }
    .btn-danger:hover { background: #ef444422; }
    .btn-secondary { background: #1a1a2e; color: #aaa; border: 1px solid #2a2a3e; }
    .btn-secondary:hover { background: #2a2a3e; }
    .row { display: flex; gap: 10px; align-items: center; }
    .row input { flex: 1; }
    .msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
    .msg-ok { color: #4ade80; }
    .msg-err { color: #ef4444; }
    .subscription-status { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    .subscription-status.active { background: #16a34a18; border: 1px solid #16a34a33; color: #4ade80; }
    .subscription-status.inactive { background: #1a1a2e; border: 1px solid #2a2a3e; color: #888; }
    .divider { border: none; border-top: 1px solid #1e1e2e; margin: 28px 0; }
  </style>
</head>
<body>
  <h1>🛂 Passport Settings</h1>
  <p class="subtitle">Manage your subscription and preferences.</p>

  <!-- Subscription -->
  <div class="section">
    <div class="section-title">Subscription</div>
    <div id="sub-status-box" class="subscription-status inactive">Checking…</div>
    <div id="sub-actions"></div>
  </div>

  <hr class="divider" />

  <!-- Restore / Manual entry -->
  <div class="section">
    <div class="section-title">Restore Access</div>
    <label for="membership-id">Enter your Whop Membership ID</label>
    <div class="row">
      <input type="text" id="membership-id" placeholder="mem_xxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false" />
      <button class="btn btn-secondary" id="verify-btn">Verify</button>
    </div>
    <div class="msg" id="verify-msg"></div>
    <p style="font-size:11px;color:#555;margin-top:10px;">
      Find your membership ID at <a href="https://whop.com/dashboard" target="_blank" style="color:#6366f1">whop.com/dashboard</a> under your active memberships.
    </p>
  </div>

  <hr class="divider" />

  <!-- Language & translation -->
  <div class="section">
    <div class="section-title">Language & Translation</div>
    <label for="native-lang">Your native language (for auto-translation)</label>
    <select id="native-lang">
      <option value="">— Select language —</option>
    </select>
  </div>

  <div class="section">
    <div class="toggle-row">
      <span>Auto-translate pages when a country is active</span>
      <input type="checkbox" id="auto-translate" />
    </div>
  </div>

  <button class="btn btn-primary" id="save">Save Settings</button>
  <span class="msg msg-ok" id="saved-msg" style="display:inline-block;margin-left:12px;opacity:0;transition:opacity 0.3s">Saved!</span>

  <script type="module" src="options.js"></script>
</body>
</html>
